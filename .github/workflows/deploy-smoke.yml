name: Deploy and smoke

on:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the PostHog acceptance smoke after deploy
        required: true
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cloudflare-ingest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ETLAYER_INGEST_KEY: ${{ secrets.ETLAYER_INGEST_KEY }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: .
        run: npm install

      - name: Ensure Cloudflare resources exist
        run: |
          npx wrangler queues create etlayer-events || true
          npx wrangler queues create etlayer-events-dlq || true
          npx wrangler r2 bucket create etlayer-events-archive || true

      - name: Configure Worker secrets
        run: |
          printf '%s' "$ETLAYER_INGEST_KEY" | npx wrangler secret put ETLAYER_INGEST_KEY
          printf '%s' "$POSTHOG_PROJECT_TOKEN" | npx wrangler secret put POSTHOG_PROJECT_TOKEN

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy | tee /tmp/wrangler-deploy.txt
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.txt | tail -1)
          if [ -z "$url" ]; then
            echo "Unable to determine workers.dev URL from Wrangler output" >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check
        run: curl --fail --silent --show-error "${{ steps.deploy.outputs.url }}/health"

      - name: Run ETLayer smoke
        if: ${{ inputs.run_smoke }}
        working-directory: .
        env:
          ETLAYER_BASE_URL: ${{ steps.deploy.outputs.url }}
          ETLAYER_INGEST_KEY: ${{ secrets.ETLAYER_INGEST_KEY }}
          ETLAYER_TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run smoke:posthog

      - name: Publish smoke coordinates
        if: ${{ inputs.run_smoke }}
        run: |
          {
            echo "## ETLayer smoke"
            echo
            echo "- Worker: `${{ steps.deploy.outputs.url }}`"
            echo "- Test run: `gha-${{ github.run_id }}-${{ github.run_attempt }}`"
            echo
            echo "Verify in PostHog by filtering `etlayer.test.run_id` to the test run above."
          } >> "$GITHUB_STEP_SUMMARY"
