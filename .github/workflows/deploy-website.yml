name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: etlayer-web-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy etlayer-web
    runs-on: ubuntu-latest
    environment: website-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_PRODUCTION_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_WORKERS_DEPLOY_PRODUCTION_TOKEN in website-production"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in website-production"
            exit 1
          fi

      - name: Verify scoped Worker access
        run: npx --yes wrangler@4.135.0 deployments list --name etlayer-web

      - name: Deploy website to Cloudflare Workers
        run: npx --yes wrangler@4.135.0 deploy --config website/wrangler.jsonc

      - name: Production acceptance
        shell: bash
        env:
          SITE_URL: https://etlayer-web.sergii-ponomarov.workers.dev
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location --max-time 15 "$SITE_URL/" -o /tmp/etlayer-index.html; then
              break
            fi

            if [ "$attempt" -eq 10 ]; then
              echo "::error::Website did not become reachable after 10 attempts"
              exit 1
            fi

            sleep 2
          done

          grep -Fq "<title>ETLayer - Own your event data plane</title>" /tmp/etlayer-index.html
          grep -Fq "Emit once." /tmp/etlayer-index.html

          curl --fail --silent --show-error --location --max-time 15 "$SITE_URL/styles.css" -o /tmp/etlayer-styles.css
          curl --fail --silent --show-error --location --max-time 15 "$SITE_URL/app.js" -o /tmp/etlayer-app.js

          test -s /tmp/etlayer-styles.css
          test -s /tmp/etlayer-app.js

          echo "Production acceptance passed: $SITE_URL"
